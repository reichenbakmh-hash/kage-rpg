<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>KAGE — Le sanctuaire oublié</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050812;
  color:white;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  touch-action:none;
}

#game{
  position:fixed;
  inset:0;
  overflow:hidden;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

.vignette{
  position:absolute;
  inset:0;
  z-index:5;
  pointer-events:none;
  background:radial-gradient(
    circle at 50% 45%,
    transparent 30%,
    rgba(0,0,0,.12) 58%,
    rgba(0,0,0,.72) 100%
  );
}

.topbar{
  position:absolute;
  top:16px;
  left:16px;
  right:16px;
  z-index:10;
  display:flex;
  justify-content:space-between;
  align-items:center;
  pointer-events:none;
}

.logo,
.orbs{
  border:1px solid rgba(255,255,255,.1);
  background:rgba(7,12,24,.58);
  backdrop-filter:blur(14px);
  box-shadow:0 10px 30px rgba(0,0,0,.25);
  border-radius:16px;
}

.logo{
  padding:10px 14px;
}

.logo b{
  display:block;
  color:#f4d18d;
  font-size:14px;
  letter-spacing:.32em;
}

.logo small{
  display:block;
  margin-top:3px;
  color:rgba(255,255,255,.42);
  font-size:8px;
  letter-spacing:.18em;
  text-transform:uppercase;
}

.orbs{
  display:flex;
  gap:7px;
  padding:10px 12px;
}

.orb{
  width:10px;
  height:10px;
  border-radius:50%;
  background:#303746;
  transition:.35s;
}

.orb.active{
  background:#f4ca75;
  box-shadow:
    0 0 8px #f4ca75,
    0 0 20px rgba(244,202,117,.6);
}

.message{
  position:absolute;
  z-index:8;
  top:22%;
  left:50%;
  width:min(90%,650px);
  transform:translate(-50%,-50%);
  text-align:center;
  opacity:0;
  pointer-events:none;
  transition:opacity .35s;
}

.message.visible{
  opacity:1;
}

.message h1{
  margin:0;
  font-size:clamp(27px,7vw,58px);
  letter-spacing:.08em;
  text-shadow:0 5px 25px rgba(0,0,0,.65);
}

.message p{
  margin:9px 0 0;
  color:rgba(255,255,255,.62);
  font-size:10px;
  letter-spacing:.2em;
  text-transform:uppercase;
}

.start{
  position:absolute;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(
      circle at 50% 40%,
      rgba(48,75,108,.32),
      transparent 42%
    ),
    linear-gradient(
      #050812,
      #091522
    );
  transition:opacity .7s,visibility .7s;
}

.start.hidden{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.start-card{
  width:min(90%,500px);
  padding:30px;
  text-align:center;
}

.kana{
  color:#d7bd8e;
  font-size:10px;
  letter-spacing:.55em;
  margin-left:.55em;
}

.start-card h1{
  margin:13px 0 5px;
  font-size:clamp(48px,14vw,88px);
  letter-spacing:.16em;
}

.subtitle{
  color:rgba(255,255,255,.45);
  font-size:11px;
  letter-spacing:.3em;
  text-transform:uppercase;
}

.start-card p{
  max-width:430px;
  margin:25px auto;
  color:rgba(255,255,255,.62);
  font-size:13px;
  line-height:1.8;
}

.start-button{
  padding:14px 25px;
  border:1px solid rgba(244,201,119,.45);
  border-radius:999px;
  background:rgba(244,201,119,.07);
  color:#f5d796;
  font-size:11px;
  letter-spacing:.2em;
  text-transform:uppercase;
  cursor:pointer;
  box-shadow:0 0 30px rgba(244,201,119,.08);
}

.hint{
  position:absolute;
  z-index:9;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  color:rgba(255,255,255,.42);
  font-size:9px;
  letter-spacing:.12em;
  text-transform:uppercase;
  white-space:nowrap;
  pointer-events:none;
}

.controls{
  position:absolute;
  z-index:12;
  left:18px;
  bottom:18px;
  display:none;
  grid-template-columns:repeat(3,46px);
  gap:5px;
}

.controls button{
  width:46px;
  height:46px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:14px;
  background:rgba(5,10,20,.58);
  color:rgba(255,255,255,.82);
  backdrop-filter:blur(10px);
  font-size:18px;
}

.empty{
  visibility:hidden;
}

@media(max-width:700px){
  .controls{
    display:grid;
  }

  .hint{
    left:auto;
    right:14px;
    transform:none;
    text-align:right;
  }

  .logo small{
    display:none;
  }
}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<div class="vignette"></div>

<div class="topbar">

  <div class="logo">
    <b>KAGE</b>
    <small>Le sanctuaire oublié</small>
  </div>

  <div class="orbs">
    <div class="orb" id="orb1"></div>
    <div class="orb" id="orb2"></div>
    <div class="orb" id="orb3"></div>
  </div>

</div>

<div class="message" id="message">
  <h1 id="messageTitle"></h1>
  <p id="messageText"></p>
</div>

<div class="hint">
  '-'
</div>

<div class="controls">

  <div class="empty"></div>

  <button data-key="ArrowUp">
    ▲
  </button>

  <div class="empty"></div>

  <button data-key="ArrowLeft">
    ◀
  </button>

  <button data-key="ArrowDown">
    ▼
  </button>

  <button data-key="ArrowRight">
    ▶
  </button>

</div>

<div class="start" id="start">

  <div class="start-card">

    <div class="kana">
      影 • かげ
    </div>

    <h1>KAGE</h1>

    <div class="subtitle">
      Le sanctuaire oublié
    </div>

    <p>
      Une petite île.<br>
      Trois lumières perdues.<br>
      Et une jeune bizarre.
    </p>

    <button
      class="start-button"
      id="startButton"
    >
      Entrer
    </button>

  </div>

</div>

<script>
"use strict";

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");

const start =
  document.getElementById("start");

const startButton =
  document.getElementById("startButton");

const message =
  document.getElementById("message");

const messageTitle =
  document.getElementById("messageTitle");

const messageText =
  document.getElementById("messageText");

const orbs = [
  document.getElementById("orb1"),
  document.getElementById("orb2"),
  document.getElementById("orb3")
];

let W = 0;
let H = 0;
let DPR = 1;

function resize(){

  DPR =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  W =
    window.innerWidth;

  H =
    window.innerHeight;

  canvas.width =
    Math.floor(W * DPR);

  canvas.height =
    Math.floor(H * DPR);

  canvas.style.width =
    W + "px";

  canvas.style.height =
    H + "px";

  ctx.setTransform(
    DPR,
    0,
    0,
    DPR,
    0,
    0
  );
}

window.addEventListener(
  "resize",
  resize
);

resize();


/* =========================
   AUDIO
========================= */

let audio = null;
let master = null;

function initAudio(){

  if(audio){

    if(audio.state === "suspended"){
      audio.resume();
    }

    return;
  }

  const AudioContext =
    window.AudioContext ||
    window.webkitAudioContext;

  if(!AudioContext){
    return;
  }

  audio =
    new AudioContext();

  master =
    audio.createGain();

  master.gain.value =
    0.045;

  master.connect(
    audio.destination
  );
}

function tone(
  frequency,
  duration,
  volume = .2,
  type = "sine"
){

  if(!audio || !master){
    return;
  }

  const osc =
    audio.createOscillator();

  const gain =
    audio.createGain();

  osc.type = type;

  osc.frequency.value =
    frequency;

  gain.gain.setValueAtTime(
    .0001,
    audio.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    volume,
    audio.currentTime + .02
  );

  gain.gain.exponentialRampToValueAtTime(
    .0001,
    audio.currentTime + duration
  );

  osc.connect(gain);
  gain.connect(master);

  osc.start();

  osc.stop(
    audio.currentTime +
    duration +
    .03
  );
}

function pickupSound(){

  tone(523.25,.18,.22);

  setTimeout(
    () => tone(
      783.99,
      .3,
      .18
    ),
    100
  );
}

function unlockSound(){

  [
    392,
    523.25,
    659.25,
    783.99
  ].forEach(
    (f,i) => {

      setTimeout(
        () => tone(
          f,
          .45,
          .16
        ),
        i * 120
      );

    }
  );
}

function stepSound(){

  tone(
    90,
    .045,
    .018,
    "triangle"
  );
}


/* =========================
   GAME STATE
========================= */

const keys =
  new Set();

const player = {

  x:0,

  y:3.1,

  speed:2.7,

  stepTimer:0

};

const shrine = {
  x:0,
  y:-5
};

const spirits = [

  {
    x:-3.7,
    y:.7,
    phase:0,
    collected:false
  },

  {
    x:3.6,
    y:-.5,
    phase:2,
    collected:false
  },

  {
    x:-2.4,
    y:-3,
    phase:4,
    collected:false
  }

];

const trees = [

  [-5,-2.2],
  [-4.7,1.7],
  [-3.8,2.8],
  [-1.8,2.7],
  [2,2.8],
  [4.5,1.5],
  [5,-1.8],
  [4,-3.2],
  [5.2,-3.7]

];

const particles = [];

let started = false;
let finished = false;
let ending = false;

let time = 0;

let cameraX = 0;
let cameraY = 0;


/* =========================
   INPUT
========================= */

function setKey(
  event,
  down
){

  const valid = [

    "ArrowUp",
    "ArrowDown",
    "ArrowLeft",
    "ArrowRight",

    "w",
    "a",
    "s",
    "d",

    "z",
    "q"

  ];

  if(
    valid.includes(event.key)
  ){

    event.preventDefault();

    if(down){
      keys.add(event.key);
    }else{
      keys.delete(event.key);
    }

  }
}

window.addEventListener(
  "keydown",
  e => setKey(e,true)
);

window.addEventListener(
  "keyup",
  e => setKey(e,false)
);

document
.querySelectorAll(".controls button")
.forEach(
  button => {

    const key =
      button.dataset.key;

    const down =
      event => {

        event.preventDefault();

        keys.add(key);
      };

    const up =
      () => keys.delete(key);

    button.addEventListener(
      "pointerdown",
      down
    );

    button.addEventListener(
      "pointerup",
      up
    );

    button.addEventListener(
      "pointercancel",
      up
    );

    button.addEventListener(
      "pointerleave",
      up
    );

  }
);


/* =========================
   START
========================= */

startButton.addEventListener(
  "click",
  () => {

    initAudio();

    started = true;

    start.classList.add(
      "hidden"
    );

    tone(
      261.63,
      .45,
      .15
    );

    showMessage(
      "Le sanctuaire attend",
      "Trois lumières errent encore sur l'île."
    );

    setTimeout(
      hideMessage,
      3000
    );

  }
);


/* =========================
   UI
========================= */

function showMessage(
  title,
  text
){

  messageTitle.textContent =
    title;

  messageText.textContent =
    text;

  message.classList.add(
    "visible"
  );
}

function hideMessage(){

  message.classList.remove(
    "visible"
  );
}

function updateOrbs(){

  spirits.forEach(
    (spirit,index) => {

      orbs[index]
        .classList.toggle(
          "active",
          spirit.collected
        );

    }
  );

}


/* =========================
   WORLD
========================= */

function screen(
  x,
  y
){

  const scale =
    Math.min(
      W,
      H
    ) / 15;

  return {

    x:
      W / 2 +
      (x - cameraX) *
      scale,

    y:
      H * .54 +
      (y - cameraY) *
      scale *
      .78

  };
}

function dist(
  ax,
  ay,
  bx,
  by
){

  return Math.hypot(
    ax - bx,
    ay - by
  );
}


/* =========================
   PARTICLES
========================= */

function particlesAdd(
  x,
  y,
  color,
  amount
){

  for(
    let i = 0;
    i < amount;
    i++
  ){

    particles.push({

      x:x,
      y:y,

      vx:
        (Math.random()-.5) *
        1.2,

      vy:
        (Math.random()-.7) *
        1.1,

      life:1,

      size:
        .025 +
        Math.random() *
        .05,

      color:color

    });

  }

}

function particlesUpdate(){

  for(
    let i =
      particles.length - 1;
    i >= 0;
    i--
  ){

    const p =
      particles[i];

    p.x += p.vx * .016;
    p.y += p.vy * .016;

    p.vy += .001;

    p.life -= .018;

    if(p.life <= 0){

      particles.splice(
        i,
        1
      );

    }

  }

}

function particlesDraw(){

  particles.forEach(
    p => {

      const s =
        screen(
          p.x,
          p.y
        );

      ctx.globalAlpha =
        Math.max(
          0,
          p.life
        );

      ctx.fillStyle =
        p.color;

      ctx.beginPath();

      ctx.arc(
        s.x,
        s.y,
        Math.max(
          1,
          p.size *
          Math.min(W,H)
        ),
        0,
        Math.PI * 2
      );

      ctx.fill();

    }
  );

  ctx.globalAlpha = 1;

}


/* =========================
   SKY
========================= */

function drawSky(){

  const gradient =
    ctx.createLinearGradient(
      0,
      0,
      0,
      H
    );

  gradient.addColorStop(
    0,
    "#071020"
  );

  gradient.addColorStop(
    .42,
    "#172c45"
  );

  gradient.addColorStop(
    .7,
    "#304960"
  );

  gradient.addColorStop(
    1,
    "#07121d"
  );

  ctx.fillStyle =
    gradient;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  /* lune */

  const mx =
    W * .77;

  const my =
    H * .18;

  const mr =
    Math.min(W,H) * .055;

  ctx.shadowColor =
    "rgba(255,225,170,.55)";

  ctx.shadowBlur = 32;

  ctx.fillStyle =
    "#f5e1b1";

  ctx.beginPath();

  ctx.arc(
    mx,
    my,
    mr,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.shadowBlur = 0;


  /* étoiles */

  for(
    let i = 0;
    i < 45;
    i++
  ){

    const x =
      (i * 83) % W;

    const y =
      25 +
      ((i * 47) %
      Math.floor(H*.38));

    const a =
      .25 +
      Math.sin(
        time * .002 + i
      ) * .15;

    ctx.fillStyle =
      `rgba(255,255,255,${a})`;

    ctx.fillRect(
      x,
      y,
      1.4,
      1.4
    );

  }

}


/* =========================
   WATER
========================= */

function drawWater(){

  ctx.fillStyle =
    "#091b2a";

  ctx.fillRect(
    0,
    H*.52,
    W,
    H*.48
  );

  for(
    let i = 0;
    i < 30;
    i++
  ){

    const y =
      H*.55 +
      i*18 +
      Math.sin(
        time*.001+i
      )*3;

    ctx.strokeStyle =
      `rgba(130,180,200,${
        .04 + (i%3)*.012
      })`;

    ctx.lineWidth = 1;

    for(
      let x = -50;
      x < W+50;
      x += 105
    ){

      const offset =
        Math.sin(
          i*2.7+
          time*.001
        )*14;

      ctx.beginPath();

      ctx.moveTo(
        x+offset,
        y
      );

      ctx.quadraticCurveTo(
        x+25+offset,
        y-3,
        x+50+offset,
        y
      );

      ctx.stroke();

    }

  }

}


/* =========================
   ISLAND
========================= */

function drawIsland(){

  const p =
    screen(
      0,
      -.6
    );

  const scale =
    Math.min(W,H)/15;

  const rx =
    scale*6;

  const ry =
    scale*3.7;


  /* ombre */

  ctx.fillStyle =
    "rgba(0,0,0,.38)";

  ctx.beginPath();

  ctx.ellipse(
    p.x,
    p.y+ry*.18,
    rx*1.03,
    ry*.94,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* sable */

  ctx.fillStyle =
    "#907a5c";

  ctx.beginPath();

  ctx.ellipse(
    p.x,
    p.y,
    rx,
    ry,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* herbe */

  const grass =
    ctx.createRadialGradient(
      p.x-rx*.2,
      p.y-ry*.2,
      10,
      p.x,
      p.y,
      rx
    );

  grass.addColorStop(
    0,
    "#39634d"
  );

  grass.addColorStop(
    .58,
    "#1e4335"
  );

  grass.addColorStop(
    1,
    "#10251f"
  );

  ctx.fillStyle =
    grass;

  ctx.beginPath();

  ctx.ellipse(
    p.x,
    p.y-scale*.12,
    rx*.88,
    ry*.78,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* chemin */

  const a =
    screen(
      player.x,
      player.y
    );

  const b =
    screen(
      0,
      -1.7
    );

  const c =
    screen(
      shrine.x,
      shrine.y
    );

  ctx.lineCap =
    "round";

  ctx.lineWidth =
    scale*.62;

  ctx.strokeStyle =
    "#756249";

  ctx.beginPath();

  ctx.moveTo(
    a.x,
    a.y
  );

  ctx.quadraticCurveTo(
    b.x,
    b.y,
    c.x,
    c.y
  );

  ctx.stroke();

  ctx.lineWidth =
    scale*.40;

  ctx.strokeStyle =
    "#55473b";

  ctx.beginPath();

  ctx.moveTo(
    a.x,
    a.y
  );

  ctx.quadraticCurveTo(
    b.x,
    b.y,
    c.x,
    c.y
  );

  ctx.stroke();

}


/* =========================
   TREES
========================= */

function drawTree(
  x,
  y
){

  const p =
    screen(
      x,
      y
    );

  const scale =
    Math.min(W,H)/15;

  const sway =
    Math.sin(
      time*.001+x*3
    )*2;


  ctx.fillStyle =
    "#402b25";

  ctx.fillRect(
    p.x-scale*.1,
    p.y-scale*.15,
    scale*.2,
    scale*.72
  );


  const crowns = [
    [-.55,.60],
    [-.88,.48],
    [-1.18,.34]
  ];

  crowns.forEach(
    (item,index) => {

      const g =
        ctx.createRadialGradient(
          p.x-8,
          p.y+item[0]*scale,
          2,
          p.x,
          p.y+item[0]*scale,
          item[1]*scale
        );

      g.addColorStop(
        0,
        index===0
          ? "#427057"
          : "#315b49"
      );

      g.addColorStop(
        1,
        "#10261f"
      );

      ctx.fillStyle = g;

      ctx.beginPath();

      ctx.arc(
        p.x+
          sway*(index+1)*.3,
        p.y+
          item[0]*scale,
        item[1]*scale,
        0,
        Math.PI*2
      );

      ctx.fill();

    }
  );

}

  /* =========================
   LANTERNE
========================= */

function drawLantern(
  x,
  y
){

  const p =
    screen(
      x,
      y
    );

  const scale =
    Math.min(W,H)/15;

  const glow =
    .5 +
    Math.sin(
      time*.004+x
    )*.1;


  ctx.fillStyle =
    "#49342a";

  ctx.fillRect(
    p.x-3,
    p.y-scale*.25,
    6,
    scale*.55
  );


  ctx.shadowColor =
    `rgba(
      245,
      201,
      110,
      ${glow}
    )`;

  ctx.shadowBlur = 22;

  ctx.fillStyle =
    "#f6ca72";

  ctx.beginPath();

  ctx.arc(
    p.x,
    p.y-scale*.25,
    scale*.085,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.shadowBlur = 0;

}


/* =========================
   SANCTUAIRE
========================= */

function drawShrine(){

  const p =
    screen(
      shrine.x,
      shrine.y
    );

  const scale =
    Math.min(W,H)/15;

  const unlocked =
    spirits.every(
      spirit =>
        spirit.collected
    );


  /* aura */

  ctx.shadowColor =
    "rgba(244,201,119,.5)";

  ctx.shadowBlur = 45;

  ctx.fillStyle =
    "rgba(244,201,119,.06)";

  ctx.beginPath();

  ctx.arc(
    p.x,
    p.y,
    scale*1.45,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.shadowBlur = 0;


  /* marches */

  ctx.fillStyle =
    "#5e5147";

  ctx.fillRect(
    p.x-scale*.75,
    p.y+scale*.3,
    scale*1.5,
    scale*.22
  );


  /* bâtiment */

  ctx.fillStyle =
    "#67323a";

  ctx.fillRect(
    p.x-scale*.9,
    p.y-scale*.65,
    scale*1.8,
    scale*.95
  );


  /* toit */

  ctx.fillStyle =
    "#15161c";

  ctx.beginPath();

  ctx.moveTo(
    p.x-scale*1.18,
    p.y-scale*.65
  );

  ctx.lineTo(
    p.x,
    p.y-scale*1.25
  );

  ctx.lineTo(
    p.x+scale*1.18,
    p.y-scale*.65
  );

  ctx.closePath();

  ctx.fill();


  /* torii */

  ctx.fillStyle =
    "#853b43";

  ctx.fillRect(
    p.x-scale*.95,
    p.y-scale*1.08,
    scale*.12,
    scale*.7
  );

  ctx.fillRect(
    p.x+scale*.83,
    p.y-scale*1.08,
    scale*.12,
    scale*.7
  );

  ctx.fillRect(
    p.x-scale*1.05,
    p.y-scale*1.12,
    scale*2.1,
    scale*.12
  );


  /* porte */

  ctx.fillStyle =
    unlocked
      ? "#efc875"
      : "#291b22";

  ctx.fillRect(
    p.x-scale*.24,
    p.y-scale*.55,
    scale*.48,
    scale*.85
  );


  drawLantern(
    shrine.x-1.1,
    shrine.y+.2
  );

  drawLantern(
    shrine.x+1.1,
    shrine.y+.2
  );

}


/* =========================
   ESPRITS
========================= */

function drawSpirit(
  spirit
){

  if(spirit.collected){
    return;
  }

  const p =
    screen(
      spirit.x,
      spirit.y
    );

  const scale =
    Math.min(W,H)/15;

  const bob =
    Math.sin(
      time*.003+
      spirit.phase
    )*
    scale*.12;

  const radius =
    scale*.14;


  ctx.shadowColor =
    "rgba(176,230,255,.9)";

  ctx.shadowBlur = 28;

  ctx.fillStyle =
    "#c8efff";

  ctx.beginPath();

  ctx.arc(
    p.x,
    p.y+bob,
    radius,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.shadowBlur = 0;


  ctx.fillStyle =
    "rgba(255,255,255,.9)";

  ctx.beginPath();

  ctx.arc(
    p.x-radius*.35,
    p.y+bob-radius*.3,
    radius*.24,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.strokeStyle =
    "rgba(185,230,255,.25)";

  ctx.beginPath();

  ctx.arc(
    p.x,
    p.y+bob,
    radius*2.2,
    0,
    Math.PI*2
  );

  ctx.stroke();

}


/* =========================
   PERSONNAGE MIGNON
========================= */

function drawPlayer(){

  const p =
    screen(
      player.x,
      player.y
    );

  const scale =
    Math.min(W,H)/15;

  const moving =
    keys.size > 0 &&
    started;

  const bob =
    moving
      ? Math.sin(
          time*.018
        )*
        scale*.035
      : 0;


  /* ombre */

  ctx.fillStyle =
    "rgba(0,0,0,.3)";

  ctx.beginPath();

  ctx.ellipse(
    p.x,
    p.y+scale*.28,
    scale*.27,
    scale*.11,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* jambes */

  ctx.fillStyle =
    "#20283a";

  ctx.fillRect(
    p.x-scale*.13,
    p.y+scale*.30+bob,
    scale*.09,
    scale*.28
  );

  ctx.fillRect(
    p.x+scale*.04,
    p.y+scale*.30+bob,
    scale*.09,
    scale*.28
  );


  /* chaussures */

  ctx.fillStyle =
    "#171923";

  ctx.beginPath();

  ctx.ellipse(
    p.x-scale*.09,
    p.y+scale*.58+bob,
    scale*.11,
    scale*.055,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.beginPath();

  ctx.ellipse(
    p.x+scale*.09,
    p.y+scale*.58+bob,
    scale*.11,
    scale*.055,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();



  ctx.fillStyle =
    "#b84e61";

  ctx.beginPath();

  ctx.moveTo(
    p.x-scale*.2,
    p.y-scale*.02+bob
  );

  ctx.quadraticCurveTo(
    p.x,
    p.y-scale*.12+bob,
    p.x+scale*.2,
    p.y-scale*.02+bob
  );

  ctx.lineTo(
    p.x+scale*.28,
    p.y+scale*.36+bob
  );

  ctx.quadraticCurveTo(
    p.x,
    p.y+scale*.44+bob,
    p.x-scale*.28,
    p.y+scale*.36+bob
  );

  ctx.closePath();

  ctx.fill();


  ctx.fillStyle =
    "#a94155";

  ctx.beginPath();

  ctx.ellipse(
    p.x-scale*.25,
    p.y+scale*.05+bob,
    scale*.075,
    scale*.19,
    -.25,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.beginPath();

  ctx.ellipse(
    p.x+scale*.25,
    p.y+scale*.05+bob,
    scale*.075,
    scale*.19,
    .25,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.fillStyle =
    "#b77b5f";

  ctx.fillRect(
    p.x-scale*.065,
    p.y-scale*.28+bob,
    scale*.13,
    scale*.13
  );


  ctx.fillStyle =
    "#b98064";

  ctx.beginPath();

  ctx.ellipse(
    p.x,
    p.y-scale*.43+bob,
    scale*.19,
    scale*.21,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.beginPath();

  ctx.arc(
    p.x-scale*.18,
    p.y-scale*.43+bob,
    scale*.055,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.beginPath();

  ctx.arc(
    p.x+scale*.18,
    p.y-scale*.43+bob,
    scale*.055,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.fillStyle =
    "#111116";

  ctx.beginPath();

  ctx.arc(
    p.x,
    p.y-scale*.55+bob,
    scale*.235,
    Math.PI,
    Math.PI*2
  );

  ctx.fill();


  const curls = [

    [-.19,-.53,.10],
    [-.12,-.64,.095],
    [-.04,-.69,.10],
    [.05,-.68,.10],
    [.14,-.62,.10],
    [.20,-.53,.095],

    [-.23,-.43,.085],
    [.23,-.43,.085]

  ];


  curls.forEach(
    c => {

      ctx.beginPath();

      ctx.arc(
        p.x+c[0]*scale,
        p.y+c[1]*scale+bob,
        c[2]*scale,
        0,
        Math.PI*2
      );

      ctx.fill();

    }
  );


  ctx.strokeStyle =
    "#211b22";

  ctx.lineWidth =
    scale*.045;

  ctx.lineCap =
    "round";

  ctx.beginPath();

  ctx.moveTo(
    p.x-scale*.17,
    p.y-scale*.57+bob
  );

  ctx.quadraticCurveTo(
    p.x-scale*.25,
    p.y-scale*.36+bob,
    p.x-scale*.18,
    p.y-scale*.25+bob
  );

  ctx.stroke();

  ctx.beginPath();

  ctx.moveTo(
    p.x+scale*.17,
    p.y-scale*.57+bob
  );

  ctx.quadraticCurveTo(
    p.x+scale*.25,
    p.y-scale*.36+bob,
    p.x+scale*.18,
    p.y-scale*.25+bob
  );

  ctx.stroke();


  ctx.fillStyle =
    "#17151a";

  ctx.beginPath();

  ctx.ellipse(
    p.x-scale*.065,
    p.y-scale*.42+bob,
    scale*.025,
    scale*.045,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.beginPath();

  ctx.ellipse(
    p.x+scale*.065,
    p.y-scale*.42+bob,
    scale*.025,
    scale*.045,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.fillStyle =
    "#ffffff";

  ctx.beginPath();

  ctx.arc(
    p.x-scale*.073,
    p.y-scale*.435+bob,
    scale*.008,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.beginPath();

  ctx.arc(
    p.x+scale*.057,
    p.y-scale*.435+bob,
    scale*.008,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.fillStyle =
    "rgba(110,66,55,.35)";

  ctx.beginPath();

  ctx.arc(
    p.x,
    p.y-scale*.36+bob,
    scale*.012,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.strokeStyle =
    "#6e403c";

  ctx.lineWidth =
    scale*.018;

  ctx.beginPath();

  ctx.arc(
    p.x,
    p.y-scale*.32+bob,
    scale*.055,
    .15,
    Math.PI-.15
  );

  ctx.stroke();



  ctx.fillStyle =
    "rgba(231,120,125,.23)";

  ctx.beginPath();

  ctx.ellipse(
    p.x-scale*.115,
    p.y-scale*.34+bob,
    scale*.05,
    scale*.025,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.beginPath();

  ctx.ellipse(
    p.x+scale*.115,
    p.y-scale*.34+bob,
    scale*.05,
    scale*.025,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.shadowColor =
    "#f5ce77";

  ctx.shadowBlur = 8;

  ctx.fillStyle =
    "#f5ce77";

  ctx.beginPath();

  ctx.arc(
    p.x+scale*.19,
    p.y+scale*.05+bob,
    scale*.04,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.shadowBlur = 0;

}

function keepInside(){

  const d =
    Math.hypot(
      player.x,
      player.y+.6
    );

  if(d > 5.15){

    const angle =
      Math.atan2(
        player.y+.6,
        player.x
      );

    player.x =
      Math.cos(angle)*5.1;

    player.y =
      Math.sin(angle)*5.1-.6;

  }

}

function collectSpirits(){

  spirits.forEach(
    spirit => {

      if(spirit.collected){
        return;
      }

      if(
        dist(
          player.x,
          player.y,
          spirit.x,
          spirit.y
        ) < .55
      ){

        spirit.collected =
          true;

        particlesAdd(
          spirit.x,
          spirit.y,
          "#c8efff",
          22
        );

        pickupSound();

        updateOrbs();

        const count =
          spirits.filter(
            s => s.collected
          ).length;

        if(count < 3){

          showMessage(
            "Une lumière retrouvée",
            `${3-count} lumière${
              3-count>1
                ? "s"
                : ""
            } restante${
              3-count>1
                ? "s"
                : ""
            }.`
          );

          setTimeout(
            hideMessage,
            1700
          );

        }else{

          showMessage(
            "Les trois esprits sont réunis",
            "Le sanctuaire reconnaît ta présence."
          );

          unlockSound();

          setTimeout(
            hideMessage,
            2800
          );

        }

      }

    }
  );

}

function checkEnding(){

  if(
    ending ||
    !spirits.every(
      s => s.collected
    )
  ){
    return;
  }

  if(
    dist(
      player.x,
      player.y,
      shrine.x,
      shrine.y
    ) < 1.1
  ){

    ending = true;
    finished = true;

    particlesAdd(
      shrine.x,
      shrine.y,
      "#f4ce77",
      75
    );

    unlockSound();

    showMessage(
      "Bienvenue",
      "Le véritable voyage commence ici."
    );

    setTimeout(
      () => {

        showMessage(
          "KAGE",
          "Prototype terminé."
        );

      },
      4000
    );

  }

}


let last =
  performance.now();

function update(now){

  const delta =
    Math.min(
      32,
      now-last
    );

  last = now;

  time += delta;


  if(
    started &&
    !finished
  ){

    let dx = 0;
    let dy = 0;


    if(
      keys.has("ArrowUp") ||
      keys.has("w") ||
      keys.has("z")
    ){
      dy--;
    }

    if(
      keys.has("ArrowDown") ||
      keys.has("s")
    ){
      dy++;
    }

    if(
      keys.has("ArrowLeft") ||
      keys.has("a") ||
      keys.has("q")
    ){
      dx--;
    }

    if(
      keys.has("ArrowRight") ||
      keys.has("d")
    ){
      dx++;
    }


    if(dx || dy){

      const length =
        Math.hypot(
          dx,
          dy
        );

      dx /= length;
      dy /= length;

      const movement =
        player.speed*
        delta/
        1000;

      player.x +=
        dx*movement;

      player.y +=
        dy*movement;


      if(
        now-player.stepTimer >
        280
      ){

        stepSound();

        player.stepTimer =
          now;

      }

    }


    keepInside();

    collectSpirits();

    checkEnding();

  }


  cameraX +=
    (
      player.x-cameraX
    )*.055;

  cameraY +=
    (
      player.y-cameraY
    )*.055;


  particlesUpdate();


  if(
    started &&
    Math.random()<.035
  ){

    particles.push({

      x:
        player.x+
        (Math.random()-.5)*9,

      y:
        player.y+
        (Math.random()-.5)*8,

      vx:0,

      vy:-.01,

      life:1,

      size:
        .018+
        Math.random()*.018,

      color:
        "rgba(190,225,230,.4)"

    });

  }


  draw();

  requestAnimationFrame(
    update
  );

}


function draw(){

  drawSky();

  drawWater();

  drawIsland();


  trees
    .slice()
    .sort(
      (a,b) =>
        a[1]-b[1]
    )
    .forEach(
      t =>
        drawTree(
          t[0],
          t[1]
        )
    );


  spirits.forEach(
    drawSpirit
  );


  drawShrine();

  drawPlayer();

  particlesDraw();


  const fog =
    ctx.createLinearGradient(
      0,
      H*.38,
      0,
      H
    );

  fog.addColorStop(
    0,
    "rgba(150,185,200,0)"
  );

  fog.addColorStop(
    1,
    "rgba(120,160,175,.06)"
  );

  ctx.fillStyle =
    fog;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  const dark =
    ctx.createRadialGradient(
      W/2,
      H/2,
      Math.min(W,H)*.18,
      W/2,
      H/2,
      Math.max(W,H)*.72
    );

  dark.addColorStop(
    0,
    "rgba(0,0,0,0)"
  );

  dark.addColorStop(
    1,
    "rgba(0,0,0,.34)"
  );

  ctx.fillStyle =
    dark;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );

}


draw();

requestAnimationFrame(
  update
);

</script>
